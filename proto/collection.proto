syntax = "proto3";
package distributed_nix.v1;

service Collection {
  rpc Bootstrap(Member) returns (Snapshot);
  rpc Prepare(Publication) returns (Prepared);
  rpc Commit(Publication) returns (Receipt);
  rpc Release(Member) returns (Receipt);
  rpc Store(stream Frame) returns (stream Frame);
}

message Member { string id = 1; }
message Snapshot { string generation = 1; uint64 paths = 2; }
message Publication { string member = 1; bytes manifest_json = 2; }
message Prepared { string id = 1; bytes manifest_json = 2; }
message Receipt { string id = 1; }
message Frame { bytes data = 1; }

// Administrative collection only; this endpoint cannot execute commands.
service OnlineGC {
  rpc Preflight(GCRequest) returns (GCReply);
  rpc Snapshot(GCRequest) returns (GCReply);
  rpc Prepare(GCRequest) returns (GCReply);
  rpc Plan(GCRequest) returns (GCReply);
  rpc Sweep(GCRequest) returns (GCReply);
  rpc Finish(GCRequest) returns (GCReply);
}
message GCRequest { string epoch = 1; bool origin = 2; bytes plan_json = 3; }
message GCReply { bytes json = 1; }
