[package]
name = "distributed-nix"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.37", default-features = false }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
subtle = "2"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
tonic-prost-build = "0.14"

[workspace]
