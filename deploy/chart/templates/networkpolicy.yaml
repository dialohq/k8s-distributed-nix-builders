apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dn.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "dn.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "dn.labels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9840
        - protocol: TCP
          port: 2049

    {{- with .Values.arcClients }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9840
    {{- end }}
