{{- $name := include "dn.name" . }}
{{- range $role := list "store" "builder" }}
{{- $values := ternary $.Values.store $.Values.builders (eq $role "store") }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-{{ $role }}
  labels:
    {{- include "dn.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  serviceName: {{ $name }}-{{ ternary "store" "builders" (eq $role "store") }}
  replicas: {{ ternary 1 (int $.Values.builders.replicas) (eq $role "store") }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "dn.labels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "dn.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "dn.labels" $ | nindent 20 }}
                    app.kubernetes.io/component: {{ $role }}
      containers:
        - name: {{ $role }}
          image: {{ default (printf "%s:%s" $.Values.image.repository $.Values.image.tag) (get $values "image") | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: DISTRIBUTED_NIX_ROLE
              value: {{ $role }}
            - name: DISTRIBUTED_NIX_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if eq $role "builder" }}
            - name: DISTRIBUTED_NIX_ARC_SLOTS
              value: {{ $.Values.builders.runnerSlots | quote }}
            - name: DISTRIBUTED_NIX_EXTRA_NIX_CONFIG
              value: {{ $.Values.builders.extraNixConfig | quote }}
            {{- end }}
            - name: DISTRIBUTED_NIX_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DISTRIBUTED_NIX_STORE_HOST
              value: {{ printf "%s-store.%s.svc.%s" $name $.Release.Namespace $.Values.clusterDomain | quote }}
            - name: DISTRIBUTED_NIX_GC_INTERVAL_SECONDS
              value: {{ $.Values.gc.intervalSeconds | quote }}
            - name: DISTRIBUTED_NIX_GC_MIN_FREE_PERCENT
              value: {{ $.Values.gc.minFreePercent | quote }}
            - name: DISTRIBUTED_NIX_GC_TARGET_FREE_PERCENT
              value: {{ $.Values.gc.targetFreePercent | quote }}
            - name: DISTRIBUTED_NIX_GC_MAX_STORE_BYTES
              value: {{ $.Values.gc.maxStoreBytes | int64 | quote }}
            - name: DISTRIBUTED_NIX_GC_TARGET_STORE_BYTES
              value: {{ $.Values.gc.targetStoreBytes | int64 | quote }}
            - name: DISTRIBUTED_NIX_PUBLICATION_MAX_AGE_SECONDS
              value: {{ $.Values.gc.publicationMaxAgeSeconds | quote }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          ports:
            - name: rpc
              containerPort: 9840
            {{- if eq $role "store" }}
            - name: nfs
              containerPort: 2049
            {{- end }}
          startupProbe:
            exec:
              command: ["/bin/distributed-nix", "pod-ready"]
            periodSeconds: 2
            failureThreshold: 600
          readinessProbe:
            exec:
              command: ["/bin/distributed-nix", "pod-ready"]
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["/bin/distributed-nix", "pod-healthy"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/distributed-nix/participants.json
              subPath: participants.json
              readOnly: true
            - name: token
              mountPath: /run/secrets/controller
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: token
          secret:
            secretName: {{ include "dn.secret" $ }}
            defaultMode: 256
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $values.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $values.storage }}
{{- end }}
