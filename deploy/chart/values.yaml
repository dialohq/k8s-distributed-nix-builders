image:
  repository: ghcr.io/dialohq/k8s-distributed-nix-builders
  tag: "0.4.9"
  pullPolicy: IfNotPresent
imagePullSecrets: []
clusterDomain: cluster.local
auth:
  # Recommended for GitOps. Secret must contain a 32–256 byte `token` key.
  existingSecret: ""
signing:
  # Optional server-side Nix output signing. Secret contains a `key` private key.
  existingSecret: ""
  # Trusted by all pool participants; required when a signing Secret is set.
  publicKeys: []
store:
  storageClass: ""
  storage: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
builders:
  image: ""
  extraNixConfig: ""
  runnerSlots: 1
  # Stable pool membership: select at installation; do not shrink existing PVCs
  # out of the pool. An unavailable participant intentionally prevents GC.
  replicas: 3
  storageClass: ""
  storage: 50Gi
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
gc:
  intervalSeconds: 3600
  minFreePercent: 25
  targetFreePercent: 30
  # Optional origin filesystem budget. Zero disables the absolute budget.
  maxStoreBytes: 0
  targetStoreBytes: 0
  publicationMaxAgeSeconds: 86400
nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
tolerations: []

# Namespace and pod selectors for authenticated ARC attachment clients.
arcClients: []

# Optional stock Nix ssh-ng endpoint, separate from the gRPC admin credential.
nativeBuilds:
  enabled: false
  # Required when enabled. Keys: authorized_keys, ssh_host_ed25519_key.
  existingSecret: ""
  # NetworkPolicy peers allowed to TCP 2222 (namespace/pod selectors or ipBlock).
  clients: []
